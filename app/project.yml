name: Martin
options:
  bundleIdPrefix: dev.ethanchen
  deploymentTarget:
    macOS: "15.0"
packages:
  MartinKit:
    path: .
targets:
  Martin:
    type: application
    platform: macOS
    sources:
      - Martin
    dependencies:
      - package: MartinKit
    info:
      path: Martin/Info.plist
      properties:
        LSUIElement: true
        NSMicrophoneUsageDescription: Martin records meetings you choose to record.
        NSCalendarsFullAccessUsageDescription: Martin names a recording after the calendar event it belongs to.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: dev.ethanchen.martin
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: NO
        SWIFT_VERSION: "6.0"
    preBuildScripts:
      - name: Build analyzer
        basedOnDependencyAnalysis: false
        script: |
          export PATH="/opt/homebrew/bin:$HOME/.bun/bin:$PATH"
          cd "$SRCROOT/../analyzer" && bun install --frozen-lockfile && bun run build
    postBuildScripts:
      - name: Bundle analyzer
        basedOnDependencyAnalysis: false
        script: |
          cp "$SRCROOT/../analyzer/dist/martin-analyzer" "$TARGET_BUILD_DIR/$UNLOCALIZED_RESOURCES_FOLDER_PATH/martin-analyzer"
